<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#1a5276"/>
  <!-- School building -->
  <rect x="36" y="90" width="120" height="80" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- Roof -->
  <polygon points="96,30 20,90 172,90" fill="#e67e22"/>
  <!-- Door -->
  <rect x="80" y="130" width="32" height="40" rx="4" fill="#1a5276"/>
  <!-- Windows left -->
  <rect x="46" y="105" width="28" height="22" rx="3" fill="#aed6f1"/>
  <!-- Windows right -->
  <rect x="118" y="105" width="28" height="22" rx="3" fill="#aed6f1"/>
  <!-- Flag pole -->
  <line x1="96" y1="30" x2="96" y2="10" stroke="#fff" stroke-width="3"/>
  <rect x="96" y="10" width="20" height="12" fill="#e74c3c"/>
  <!-- Text -->
  <text x="96" y="185" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" opacity="0.8">AN NAMIROH</text>
</svg>
