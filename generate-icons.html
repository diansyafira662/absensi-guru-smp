<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const r = size * 0.208; // border radius

  // Background
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#1a5276';
  ctx.fill();

  const s = size / 192;

  // Roof (orange triangle)
  ctx.beginPath();
  ctx.moveTo(96 * s, 30 * s);
  ctx.lineTo(20 * s, 90 * s);
  ctx.lineTo(172 * s, 90 * s);
  ctx.closePath();
  ctx.fillStyle = '#e67e22';
  ctx.fill();

  // Building body (white)
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  roundRect(ctx, 36*s, 90*s, 120*s, 80*s, 4*s);
  ctx.fill();

  // Door
  ctx.fillStyle = '#1a5276';
  roundRect(ctx, 80*s, 130*s, 32*s, 40*s, 4*s);
  ctx.fill();

  // Windows
  ctx.fillStyle = '#aed6f1';
  roundRect(ctx, 46*s, 105*s, 28*s, 22*s, 3*s);
  ctx.fill();
  roundRect(ctx, 118*s, 105*s, 28*s, 22*s, 3*s);
  ctx.fill();

  // Flag pole
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3 * s;
  ctx.beginPath();
  ctx.moveTo(96*s, 30*s);
  ctx.lineTo(96*s, 10*s);
  ctx.stroke();

  // Flag
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(96*s, 10*s, 20*s, 12*s);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

const c192 = document.getElementById('c192');
const c512 = document.getElementById('c512');
drawIcon(c192, 192);
drawIcon(c512, 512);

// Download both
function downloadCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

setTimeout(() => {
  downloadCanvas(c192, 'icon-192.png');
  setTimeout(() => downloadCanvas(c512, 'icon-512.png'), 500);
}, 300);
</script>
<p>Ikon sedang diunduh otomatis. Simpan <strong>icon-192.png</strong> dan <strong>icon-512.png</strong> ke folder aplikasi.</p>
</body>
</html>
